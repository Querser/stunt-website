services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: stunt_user
      POSTGRES_PASSWORD: stunt_password
      POSTGRES_DB: stunt_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stunt_user -d stunt_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: always
    expose:
      - "8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://stunt_user:stunt_password@db:5432/stunt_db
      - APP_ENV=${APP_ENV:-development}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-stunt2026}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH:-}
      - SECRET_KEY=${SECRET_KEY:-dev-only-stunt-tech-secret-key-change-before-production}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3001,http://127.0.0.1:3001}
      - PUBLIC_BACKEND_URL=${PUBLIC_BACKEND_URL:-http://127.0.0.1:8001}
      - PUBLIC_SITE_URL=${PUBLIC_SITE_URL:-http://127.0.0.1:3001}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-120}
      - CACHE_KEY_PREFIX=${CACHE_KEY_PREFIX:-stunttech}
      - WOOCOMMERCE_ENABLED=${WOOCOMMERCE_ENABLED:-true}
      - WOOCOMMERCE_STORE_API_URL=${WOOCOMMERCE_STORE_API_URL:-https://stunttech.ru/wp-json/wc/store/v1}
      - WOOCOMMERCE_CACHE_TTL_SECONDS=${WOOCOMMERCE_CACHE_TTL_SECONDS:-300}
      - WOOCOMMERCE_PER_PAGE=${WOOCOMMERCE_PER_PAGE:-100}
      - PAYKEEPER_ENABLED=${PAYKEEPER_ENABLED:-false}
      - PAYKEEPER_FORM_URL=${PAYKEEPER_FORM_URL:-https://stunttech.server.paykeeper.ru/create/}
      - PAYKEEPER_SECRET_SEED=${PAYKEEPER_SECRET_SEED:-}
      - PAYKEEPER_SERVER_URL=${PAYKEEPER_SERVER_URL:-}
      - PAYKEEPER_USERNAME=${PAYKEEPER_USERNAME:-}
      - PAYKEEPER_PASSWORD=${PAYKEEPER_PASSWORD:-}
      - PAYKEEPER_TIMEOUT_SECONDS=${PAYKEEPER_TIMEOUT_SECONDS:-15}
      - VANTA_ENABLED=${VANTA_ENABLED:-false}
      - VANTA_FORM_URL=${VANTA_FORM_URL:-}
      - VANTA_PARTNER_ID=${VANTA_PARTNER_ID:-}
      - VANTA_TRADE_ID=${VANTA_TRADE_ID:-}
      - VANTA_WEBHOOK_SECRET=${VANTA_WEBHOOK_SECRET:-}
      - VANTA_APPLICATION_TYPE=${VANTA_APPLICATION_TYPE:-credits}
      - VANTA_TERMS=${VANTA_TERMS:-6,12,24,36}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
        INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:8000}
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api/v1}
      - INTERNAL_API_URL=${INTERNAL_API_URL:-http://backend:8000}
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    build: ./nginx
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  postgres_data:
  backend_uploads:
