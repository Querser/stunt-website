upstream stunt_frontend {
    server frontend:3000;
}

upstream stunt_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    client_max_body_size 20m;

    ssl_certificate /etc/nginx/certs/stunttech.crt;
    ssl_certificate_key /etc/nginx/certs/stunttech.key;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    location /api/ {
        proxy_pass http://stunt_backend;
    }

    location /health {
        proxy_pass http://stunt_backend/health;
    }

    location /wc-api/ {
        proxy_pass http://stunt_backend;
    }

    location /static/uploads/ {
        proxy_pass http://stunt_backend;
    }

    location /_next/ {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://stunt_frontend;
    }

    location / {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://stunt_frontend;
    }
}
